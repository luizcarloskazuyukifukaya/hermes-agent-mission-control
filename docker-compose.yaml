# ============================================================================
# Hermy HQ + hermes-bridge + Postgres — V-Decent / Coolify
# Target: vdecentserver0
# Reuses the EXISTING hermes-agent container (host network) — not recreated.
# Current upstream architecture: hermy-hq and hermes-bridge talk to each
# other only through Postgres (message bus). hermes-bridge is the only
# service that execs the `hermes` CLI.
#
# Hermes's own built-in web dashboard (the `hermes dashboard` CLI command,
# basic-auth UI) is deliberately NOT part of this stack — it's owned and
# deployed by the Hermes Agent project itself, not Hermy HQ.
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Postgres — message bus shared by hermy-hq and hermes-bridge
  # Service name is deliberately NOT the generic "postgres": hermy-hq also
  # sits on the shared "coolify" proxy network, and Docker's embedded DNS
  # resolves service-name aliases across every network a container is on —
  # a generic "postgres" alias collided with an unrelated app's DB service
  # on that shared network and silently connected hermy-hq to the wrong
  # database. "hermy-hq-postgres" is specific enough to not collide.
  # ---------------------------------------------------------------------------
  hermy-hq-postgres:
    image: postgres:17-alpine
    container_name: hermy-hq-postgres
    restart: unless-stopped
    expose:
      - "5432"
    # Published to the host's loopback only (not externally reachable) so
    # hermes-bridge — which runs on network_mode: host to reach the
    # omniroute LLM gateway on the host's 127.0.0.1:20128 — can still
    # reach Postgres, since host networking has no Docker-DNS access to
    # the "hermy-hq-postgres" service-name alias used on the default network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=hermy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=hermy_hq
    volumes:
      - hermy_hq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermy -d hermy_hq"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Hermy HQ — Next.js Mission Control (PUBLIC, Traefik-managed)
  # ---------------------------------------------------------------------------
  hermy-hq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_OWNER_NAME=${NEXT_PUBLIC_OWNER_NAME:-}
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://dashboard.v-decent.org}
    image: hermy-hq
    container_name: hermy-hq
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - default
      - coolify
    labels:
      - "coolify.managed=true"
    # The app only listens on IPv4 (HOSTNAME=0.0.0.0), but the shared
    # "coolify" network also hands out an IPv6 address per container, and
    # Traefik's Docker provider isn't guaranteed to pick the v4 one (seen
    # concretely: it picked another public service's v6 address on this
    # same network and got connection-refused despite the app being
    # perfectly reachable over v4). Disabling v6 removes the ambiguity.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      hermy-hq-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_URL=${POSTGRES_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://dashboard.v-decent.org}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - NEXT_PUBLIC_OWNER_NAME=${NEXT_PUBLIC_OWNER_NAME:-}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://dashboard.v-decent.org}
      - HERMES_BOARD=${HERMES_BOARD:-default}
      - BRIEF_HOUR=${BRIEF_HOUR:-11}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}

  # ---------------------------------------------------------------------------
  # hermes-bridge-prep — one-shot: builds bridge.mjs + its node_modules (pg,
  # pure JS) and copies them into a shared volume. Runs once per
  # `docker compose up`, then exits.
  # ---------------------------------------------------------------------------
  hermes-bridge-prep:
    build:
      context: ./hermes-bridge
      dockerfile: Dockerfile
    image: hermes-bridge-prep
    container_name: hermes-bridge-prep
    restart: "no"
    volumes:
      - hermes-bridge-app:/shared
    networks:
      - default

  # ---------------------------------------------------------------------------
  # hermes-bridge — polls Postgres, runs queued/approved AgentRequests via
  # the `hermes` CLI, mirrors kanban/cron/health/memory back. Not web-facing.
  #
  # Runs inside hermes-agent-hermes:latest itself (not a container built from
  # this repo) because the `hermes` CLI is a Python entry-point needing
  # python3.11 + the hermes_cli package, which only that image has; that
  # image also already has Node. Using `image:` (no build) avoids ever
  # needing that local-only image (never published to a registry) as a
  # build-time FROM source, which fails under Coolify's
  # `docker compose build --pull`.
  # ---------------------------------------------------------------------------
  hermes-bridge:
    image: hermes-agent-hermes:latest
    container_name: hermes-bridge
    restart: unless-stopped
    # host networking: the `hermes` CLI's config.yaml (shared, bind-mounted
    # from the host at /home/kfukaya/hermes-agent/data — same file used by
    # interactive hermes sessions on this host) points its LLM provider at
    # http://127.0.0.1:20128/v1, the omniroute gateway bound to the host's
    # own loopback. On the default bridge network that 127.0.0.1 was this
    # container's own loopback, not the host's, so every chat/oneshot
    # dispatch failed with "Connection error." Host networking makes
    # 127.0.0.1 resolve correctly without touching the shared config file.
    network_mode: host
    depends_on:
      hermy-hq-postgres:
        condition: service_healthy
      hermes-bridge-prep:
        condition: service_completed_successfully
    volumes:
      - /home/kfukaya/hermes-agent/data:/opt/data
      - hermes-bridge-app:/opt/bridge:ro
    environment:
      # Host networking has no Docker-DNS, so the "hermy-hq-postgres"
      # service-name alias used by ${DATABASE_URL} doesn't resolve here —
      # reach Postgres via its host-published loopback port instead.
      - DATABASE_URL=postgresql://hermy:${POSTGRES_PASSWORD}@127.0.0.1:5432/hermy_hq
      - HERMES_BOARD=${HERMES_BOARD:-default}
      - HERMES_WIKI=/opt/data/wiki
      - HERMES_HOME=/opt/data
      - BRIEF_HOUR=${BRIEF_HOUR:-11}
    command: ["node", "/opt/bridge/bridge.mjs"]

volumes:
  hermy_hq_postgres_data:
  hermes-bridge-app:

networks:
  coolify:
    external: true
